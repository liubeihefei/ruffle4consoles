name: build

on: [push, pull_request, workflow_dispatch]

jobs:
    build-psp2:
        name: PSVita
        runs-on: ubuntu-latest
        container: ghcr.io/vita-rust/vitasdk-rs

        steps:
            - uses: actions/checkout@v6

            - name: Prepare memory-optimized Ruffle
              run: |
                git init ruffle-vita-core
                git -C ruffle-vita-core remote add origin https://github.com/ruffle-rs/ruffle
                git -C ruffle-vita-core fetch --depth=1 origin 563854a8911eda672b1836fb374063162879035d
                git -C ruffle-vita-core checkout --detach FETCH_HEAD
                git -C ruffle-vita-core apply --check ../patches/ruffle-vita-bitmap-slices.patch
                git -C ruffle-vita-core apply ../patches/ruffle-vita-bitmap-slices.patch
                git -C ruffle-vita-core apply --check ../patches/ruffle-vita-bitmap-lifecycle.patch
                git -C ruffle-vita-core apply ../patches/ruffle-vita-bitmap-lifecycle.patch
                git -C ruffle-vita-core apply --check ../patches/ruffle-vita-bitmap-gpu-authoritative.patch
                git -C ruffle-vita-core apply ../patches/ruffle-vita-bitmap-gpu-authoritative.patch
                git -C ruffle-vita-core apply --check ../patches/ruffle-vita-bitmap-small-cpu-drop.patch
                git -C ruffle-vita-core apply ../patches/ruffle-vita-bitmap-small-cpu-drop.patch
                git -C ruffle-vita-core apply --check ../patches/ruffle-vita-jpeg-inplace.patch
                git -C ruffle-vita-core apply ../patches/ruffle-vita-jpeg-inplace.patch
                git -C ruffle-vita-core apply --check --unidiff-zero ../patches/ruffle-vita-jpeg-rows.patch
                git -C ruffle-vita-core apply --unidiff-zero ../patches/ruffle-vita-jpeg-rows.patch
                git -C ruffle-vita-core apply --check ../patches/ruffle-vita-progress8-memory.patch
                git -C ruffle-vita-core apply ../patches/ruffle-vita-progress8-memory.patch
                sed -i 's#ruffle_core = { git = "https://github.com/ruffle-rs/ruffle", rev = "563854a8911eda672b1836fb374063162879035d",#ruffle_core = { path = "ruffle-vita-core/core",#' Cargo.toml
                sed -i 's#ruffle_render = { git = "https://github.com/ruffle-rs/ruffle", rev = "563854a8911eda672b1836fb374063162879035d" }#ruffle_render = { path = "ruffle-vita-core/render" }#' Cargo.toml
                sed -i 's#ruffle_render = { git = "https://github.com/ruffle-rs/ruffle", rev = "563854a8911eda672b1836fb374063162879035d", features = \["tessellator"\] }#ruffle_render = { path = "../ruffle-vita-core/render", features = ["tessellator"] }#' ruffle_render_glow/Cargo.toml
                sed -i 's#swf = { git = "https://github.com/ruffle-rs/ruffle", rev = "563854a8911eda672b1836fb374063162879035d" }#swf = { path = "../ruffle-vita-core/swf" }#' ruffle_render_glow/Cargo.toml
                sed -i '\#source = "git+https://github.com/ruffle-rs/ruffle?rev=563854a8911eda672b1836fb374063162879035d#d' Cargo.lock
                grep -Fq 'ruffle_core = { path = "ruffle-vita-core/core",' Cargo.toml
                grep -Fq 'ruffle_render = { path = "ruffle-vita-core/render" }' Cargo.toml
                grep -Fq 'ruffle_render = { path = "../ruffle-vita-core/render", features = ["tessellator"] }' ruffle_render_glow/Cargo.toml
                grep -Fq 'swf = { path = "../ruffle-vita-core/swf" }' ruffle_render_glow/Cargo.toml
                if grep -Fq 'source = "git+https://github.com/ruffle-rs/ruffle?rev=563854a8911eda672b1836fb374063162879035d' Cargo.lock; then exit 1; fi
                git -C ruffle-vita-core diff --check

            - name: Install Java and Northfear SDL
              run: |
                apk add --no-cache openjdk11 cmake samurai
                git init SDL
                cd SDL
                git remote add origin https://github.com/Northfear/SDL/
                git fetch --depth=1 origin f99bb638f7eb256fa812e9da15d4e295a170640c
                git checkout --detach FETCH_HEAD
                cmake -S. -Bbuild -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_TOOLCHAIN_FILE=${VITASDK}/share/vita.toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DVIDEO_VITA_VGL=ON -G Ninja
                cmake --build build --parallel $(nproc)
                cmake --install build
                
            - name: Install vitaGL
              run: |
                git init vitaShaRK
                cd vitaShaRK
                git remote add origin https://github.com/Rinnegatamante/vitaShaRK
                git fetch --depth=1 origin 807cfc66b6f1ed438f4c68d0aac1262b4e5ace8a
                git checkout --detach FETCH_HEAD
                make install -j$(nproc)
                cd ..
                git init vitaGL
                cd vitaGL
                git remote add origin https://github.com/Rinnegatamante/vitaGL
                git fetch --depth=1 origin e8f01bf52df3d85a111fdb3d51113a4df085c43f
                git checkout --detach FETCH_HEAD
                make PRIMITIVES_SPEEDHACK=0 USE_SCRATCH_MEMORY=1 HAVE_CUSTOM_HEAP=1 HAVE_PTHREAD=1 HAVE_VITA3K_SUPPORT=1 NO_SPLASHSCREEN=1 LOG_ERRORS=1 install -j$(nproc)
     
            - name: Build
              shell: bash
              run: |
                set +e
                ./build_psp2.sh 2>&1 | tee /tmp/vita-build.log
                status=${PIPESTATUS[0]}
                if [ "$status" -ne 0 ]; then
                  details=$(tail -n 120 /tmp/vita-build.log)
                  details=${details//'%'/'%25'}
                  details=${details//$'\r'/'%0D'}
                  details=${details//$'\n'/'%0A'}
                  echo "::error title=PSVita build failed::$details"
                fi
                exit "$status"

            - name: Export VPK for local deployment
              if: success() && github.ref == 'refs/heads/progress8-sparse-bitmap'
              shell: bash
              run: |
                git config user.name "codex-build"
                git config user.email "codex-build@users.noreply.github.com"
                mkdir -p .codex-artifacts
                cp target/armv7-sony-vita-newlibeabihf/vita/ruffle4consoles.vpk .codex-artifacts/ruffle4consoles-${GITHUB_SHA}.vpk
                git add .codex-artifacts
                git commit -m "[skip ci] export Vita artifact ${GITHUB_SHA}" || true
                git push origin "HEAD:refs/heads/codex-vita-artifact-${GITHUB_SHA}"

            - uses: actions/upload-artifact@v7
              with:
                name: vita
                path: target/armv7-sony-vita-newlibeabihf/vita/ruffle4consoles.vpk

            - uses: actions/upload-artifact@v7
              with:
                name: vita-self
                path: target/armv7-sony-vita-newlibeabihf/vita/ruffle4consoles.self

    build-nx:
        name: Nintendo Switch
        runs-on: ubuntu-latest
        container: devkitpro/devkita64

        steps:
            - uses: actions/checkout@v6

            - name: Install Java
              run: sudo apt update && sudo apt install default-jdk -y

            - uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                toolchain: nightly
                components: rust-src

            - name: Build
              run: ./build_nx.sh

            - uses: actions/upload-artifact@v7
              with:
                name: switch
                path: target/aarch64-nintendo-switch/switch/ruffle4consoles.nro
        
